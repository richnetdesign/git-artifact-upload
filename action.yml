name: Git Artifact Upload
description: Upload build outputs to GitHub/Gitea artifacts and optionally to S3-compatible object storage.
author: richnetdesign

inputs:
  name:
    description: Artifact name
    required: true
  path:
    description: File(s) or directory path(s) to upload (newline-separated patterns supported)
    required: true
  retention-days:
    description: Days to keep artifact (where supported)
    required: false
    default: '7'
  if-no-files-found:
    description: Behavior when no files are found (warn|error|ignore)
    required: false
    default: 'warn'
  compression-level:
    description: Compression level for GitHub upload-artifact (0-9)
    required: false
    default: '6'
  overwrite:
    description: Overwrite an existing artifact with same name if supported
    required: false
    default: 'false'
  include-hidden-files:
    description: Include dotfiles in upload if supported
    required: false
    default: 'false'
  version:
    description: Explicit version string used for naming (overrides version-source)
    required: false
    default: ''
  version-source:
    description: How to derive version when version is empty (none|git-tag|git-describe)
    required: false
    default: 'none'
  build-type:
    description: Optional build type for naming (debug|release)
    required: false
    default: ''
  obfuscated:
    description: Whether build is obfuscated (true|false)
    required: false
    default: 'false'
  name-template:
    description: "Template for resolved upload name: {name} {version} {build_type} {obfuscated} {obf_suffix} {sha} {run_number}"
    required: false
    default: '{name}'
  sanitize-name:
    description: Sanitize resolved name to safe characters [A-Za-z0-9._-]
    required: false
    default: 'true'
  append-max-detail-suffix:
    description: Append max-detail suffix (version, build type, obfuscation, sha, run number) to resolved name
    required: false
    default: 'false'

  upload-target:
    description: "Upload destination: artifact, s3, or both"
    required: false
    default: 'artifact'

  s3-bucket:
    description: S3 bucket/container name (required for s3/both)
    required: false
    default: ''
  s3-prefix:
    description: Prefix/folder path inside bucket
    required: false
    default: ''
  append-resolved-name-to-s3-prefix:
    description: Append resolved upload name to s3-prefix (true|false)
    required: false
    default: 'false'
  s3-endpoint-url:
    description: S3 endpoint URL for SeaweedFS/RustFS/other compatible backends
    required: false
    default: ''
  s3-region:
    description: S3 region
    required: false
    default: 'us-east-1'
  s3-access-key-id:
    description: S3 access key id (if omitted, use runner env/role)
    required: false
    default: ''
  s3-secret-access-key:
    description: S3 secret key (if omitted, use runner env/role)
    required: false
    default: ''
  s3-session-token:
    description: Optional session token
    required: false
    default: ''
  s3-force-path-style:
    description: Force path-style addressing (recommended for many S3-compatible services)
    required: false
    default: 'true'

outputs:
  resolved-name:
    description: Final resolved upload name after template expansion.
    value: ${{ steps.resolve.outputs.resolved-name }}
  resolved-version:
    description: Final resolved version used in template expansion.
    value: ${{ steps.resolve.outputs.resolved-version }}

runs:
  using: composite
  steps:
    - name: Resolve upload name
      id: resolve
      shell: bash
      run: |
        set -euo pipefail

        base_name="${{ inputs.name }}"
        template="${{ inputs.name-template }}"
        version_input="${{ inputs.version }}"
        version_source="${{ inputs.version-source }}"
        build_type="${{ inputs.build-type }}"
        obfuscated="${{ inputs.obfuscated }}"
        sanitize="${{ inputs.sanitize-name }}"
        append_max_detail_suffix="${{ inputs.append-max-detail-suffix }}"

        case "$version_source" in
          none|git-tag|git-describe) ;;
          *)
            echo "Invalid version-source: $version_source (expected none|git-tag|git-describe)"
            exit 1
            ;;
        esac

        case "$build_type" in
          ""|debug|release) ;;
          *)
            echo "Invalid build-type: $build_type (expected debug|release)"
            exit 1
            ;;
        esac

        case "$obfuscated" in
          true|false) ;;
          *)
            echo "Invalid obfuscated: $obfuscated (expected true|false)"
            exit 1
            ;;
        esac

        case "$sanitize" in
          true|false) ;;
          *)
            echo "Invalid sanitize-name: $sanitize (expected true|false)"
            exit 1
            ;;
        esac

        case "$append_max_detail_suffix" in
          true|false) ;;
          *)
            echo "Invalid append-max-detail-suffix: $append_max_detail_suffix (expected true|false)"
            exit 1
            ;;
        esac

        resolved_version="$version_input"
        if [ -z "$resolved_version" ]; then
          case "$version_source" in
            none)
              resolved_version=""
              ;;
            git-tag)
              resolved_version="$(git describe --tags --exact-match 2>/dev/null || true)"
              ;;
            git-describe)
              resolved_version="$(git describe --tags --always --dirty 2>/dev/null || true)"
              ;;
          esac
        fi

        sha="$(git rev-parse --short HEAD 2>/dev/null || true)"
        if [ -z "$sha" ] && [ -n "${GITHUB_SHA:-}" ]; then
          sha="${GITHUB_SHA:0:7}"
        fi

        obf_suffix=""
        if [ "$obfuscated" = "true" ]; then
          obf_suffix="-obf"
        fi

        run_number="${GITHUB_RUN_NUMBER:-}"
        resolved_name="$template"
        resolved_name="${resolved_name//\{name\}/$base_name}"
        resolved_name="${resolved_name//\{version\}/$resolved_version}"
        resolved_name="${resolved_name//\{build_type\}/$build_type}"
        resolved_name="${resolved_name//\{obfuscated\}/$obfuscated}"
        resolved_name="${resolved_name//\{obf_suffix\}/$obf_suffix}"
        resolved_name="${resolved_name//\{sha\}/$sha}"
        resolved_name="${resolved_name//\{run_number\}/$run_number}"

        if [ "$append_max_detail_suffix" = "true" ]; then
          detail_parts=()
          if [ -n "$resolved_version" ]; then
            detail_parts+=("$resolved_version")
          fi
          if [ -n "$build_type" ]; then
            detail_parts+=("$build_type")
          fi
          if [ "$obfuscated" = "true" ]; then
            detail_parts+=("obf")
          else
            detail_parts+=("plain")
          fi
          if [ -n "$sha" ]; then
            detail_parts+=("$sha")
          fi
          if [ -n "$run_number" ]; then
            detail_parts+=("run$run_number")
          fi

          if [ ${#detail_parts[@]} -gt 0 ]; then
            detail_suffix="$(IFS=-; echo "${detail_parts[*]}")"
            resolved_name="${resolved_name}-${detail_suffix}"
          fi
        fi

        if [ "$sanitize" = "true" ]; then
          resolved_name="$(printf '%s' "$resolved_name" | tr '[:space:]' '-' | sed -E 's/[^A-Za-z0-9._-]+/-/g; s/^-+//; s/-+$//; s/-+/-/g')"
        fi
        if [ -z "$resolved_name" ]; then
          resolved_name="$base_name"
        fi

        echo "resolved-name=$resolved_name" >> "$GITHUB_OUTPUT"
        echo "resolved-version=$resolved_version" >> "$GITHUB_OUTPUT"

    - name: Upload artifact (GitHub)
      if: ${{ (inputs.upload-target == 'artifact' || inputs.upload-target == 'both') && github.server_url == 'https://github.com' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.resolve.outputs.resolved-name }}
        path: ${{ inputs.path }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        compression-level: ${{ inputs.compression-level }}
        overwrite: ${{ inputs.overwrite }}
        include-hidden-files: ${{ inputs.include-hidden-files }}

    - name: Upload artifact (Gitea/Forgejo)
      if: ${{ (inputs.upload-target == 'artifact' || inputs.upload-target == 'both') && github.server_url != 'https://github.com' }}
      uses: ChristopherHX/gitea-upload-artifact@main
      with:
        name: ${{ steps.resolve.outputs.resolved-name }}
        path: ${{ inputs.path }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: ${{ inputs.if-no-files-found }}

    - name: Ensure AWS CLI for S3 uploads
      if: ${{ inputs.upload-target == 's3' || inputs.upload-target == 'both' }}
      shell: bash
      run: |
        set -euo pipefail
        if command -v aws >/dev/null 2>&1; then
          aws --version
          exit 0
        fi
        python3 -m pip install --user awscli
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        "$HOME/.local/bin/aws" --version

    - name: Upload to S3-compatible storage
      if: ${{ inputs.upload-target == 's3' || inputs.upload-target == 'both' }}
      shell: bash
      env:
        AWS_DEFAULT_REGION: ${{ inputs.s3-region }}
        AWS_ACCESS_KEY_ID: ${{ inputs.s3-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.s3-secret-access-key }}
        AWS_SESSION_TOKEN: ${{ inputs.s3-session-token }}
        RESOLVED_NAME: ${{ steps.resolve.outputs.resolved-name }}
      run: |
        set -euo pipefail

        if [ -z "${{ inputs.s3-bucket }}" ]; then
          echo "s3-bucket is required when upload-target is s3 or both"
          exit 1
        fi

        if [ "${{ inputs.s3-force-path-style }}" = "true" ]; then
          aws configure set default.s3.addressing_style path
        fi

        endpoint_args=()
        if [ -n "${{ inputs.s3-endpoint-url }}" ]; then
          endpoint_args+=(--endpoint-url "${{ inputs.s3-endpoint-url }}")
        fi

        prefix="${{ inputs.s3-prefix }}"
        if [ "${{ inputs.append-resolved-name-to-s3-prefix }}" = "true" ]; then
          if [ -n "$prefix" ]; then
            prefix="${prefix%/}/${RESOLVED_NAME}"
          else
            prefix="${RESOLVED_NAME}"
          fi
        elif [ "${{ inputs.append-resolved-name-to-s3-prefix }}" != "false" ]; then
          echo "Invalid append-resolved-name-to-s3-prefix value: ${{ inputs.append-resolved-name-to-s3-prefix }} (expected true|false)"
          exit 1
        fi
        prefix="${prefix#/}"
        if [ -n "$prefix" ] && [ "${prefix: -1}" != "/" ]; then
          prefix="$prefix/"
        fi
        dest="s3://${{ inputs.s3-bucket }}/${prefix}"

        shopt -s globstar nullglob

        include_args=(--exclude "*")
        found=0
        while IFS= read -r raw; do
          p="$(echo "$raw" | xargs)"
          [ -z "$p" ] && continue

          if [ -d "$p" ]; then
            include_args+=(--include "$p/**")
          else
            include_args+=(--include "$p")
          fi

          matches=( $p )
          if [ ${#matches[@]} -gt 0 ]; then
            found=1
          fi
        done <<< "${{ inputs.path }}"

        if [ "$found" -eq 0 ]; then
          case "${{ inputs.if-no-files-found }}" in
            error)
              echo "No files found for path patterns."
              exit 1
              ;;
            warn)
              echo "Warning: no files found for path patterns."
              exit 0
              ;;
            ignore)
              exit 0
              ;;
            *)
              echo "Invalid if-no-files-found value: ${{ inputs.if-no-files-found }}"
              exit 1
              ;;
          esac
        fi

        aws s3 sync . "$dest" "${endpoint_args[@]}" "${include_args[@]}"
        echo "Uploaded matching files to $dest"
